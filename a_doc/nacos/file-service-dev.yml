server:
  # file-service 本地监听端口。
  port: 52049
  servlet:
    # 服务上下文路径，最终接口形如 /file/file/upload。
    context-path: /file

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://81.70.186.59:5432/postgres?currentSchema=zhou6&tcpKeepAlive=true
    username: postgres
    password: a741741.
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 1500000
      keepalive-time: 300000
  servlet:
    multipart:
      # 单个文件上传大小限制。
      max-file-size: 50MB
      # 单次 multipart 请求总大小限制。
      max-request-size: 50MB
storage:
