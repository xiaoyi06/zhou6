  obs:
    endpoint: https://obs.dualstack.cn-north-12.myhuaweicloud.com
    public-endpoint: https://zhou66.obs.dualstack.cn-north-12.myhuaweicloud.com
    region: cn-north-12
    access-key: HPUAQKFIQMSXEYHA7NWQ
    secret-key: 3DtVHCadJX0yXT5o1xVVafM1kIAIEjwZFsyiX9uG
    bucket-name: zhou66
    # 公有云一般使用 virtual-host style。
    path-style-access: false
  # MinIO 配置，通常使用 path-style 访问。
  minio:
    # MinIO SDK 访问地址。
    endpoint: http://127.0.0.1:9000
    # 对外返回的访问地址，未配置时使用 endpoint。
    public-endpoint: http://127.0.0.1:9000
    # MinIO 可使用默认区域 us-east-1。
    region: us-east-1
    access-key: your-ak
    secret-key: your-sk
